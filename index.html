<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f4ef">
  <title>我的个人主页</title>
  <style>
    :root { color-scheme: light; --ink:#20271f; --muted:#657064; --accent:#3e6848; --paper:#f5f4ef; --line:#d8ddd3; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family: ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
    main { width:min(920px,calc(100% - 40px)); margin:0 auto; padding:28px 0 72px; }
    nav { display:flex; justify-content:space-between; align-items:center; padding:12px 0 56px; color:var(--muted); font-size:14px; }
    .mark { color:var(--ink); font-weight:700; letter-spacing:.04em; }
    .hero { padding:clamp(38px,9vw,92px) 0 76px; border-bottom:1px solid var(--line); }
    .eyebrow { color:var(--accent); font-size:13px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; }
    h1 { max-width:760px; margin:22px 0; font-size:clamp(46px,9vw,88px); line-height:1.04; letter-spacing:-.065em; font-weight:650; }
    .intro { max-width:600px; color:var(--muted); font-size:clamp(17px,2.5vw,21px); line-height:1.8; }
    .section { padding:48px 0; border-bottom:1px solid var(--line); }
    h2 { margin:0 0 22px; font-size:13px; letter-spacing:.13em; text-transform:uppercase; color:var(--muted); }
    .cards { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
    .card { min-height:150px; padding:22px; border:1px solid var(--line); border-radius:14px; background:rgba(255,255,255,.45); }
    .card b { display:block; margin-bottom:10px; font-size:18px; }
    .card p { margin:0; color:var(--muted); line-height:1.65; font-size:14px; }
    footer { display:flex; justify-content:space-between; gap:16px; padding-top:24px; color:var(--muted); font-size:13px; }
    @media(max-width:640px) { nav{padding-bottom:28px}.cards{grid-template-columns:1fr}.card{min-height:unset}footer{flex-direction:column} }
  </style>
</head>
<body>
  <main>
    <nav><span class="mark">PERSONAL PAGE</span><span>你好，欢迎来访</span></nav>
    <section class="hero">
      <div class="eyebrow">Hello, world</div>
      <h1>你好，<br>这是我的主页。</h1>
      <p class="intro">我喜欢学习新事物，也享受把想法一点点变成现实。这里是我的网络小角落，之后会持续记录正在探索的主题与作品。</p>
    </section>
    <section class="section">
      <h2>正在关注</h2>
      <div class="cards">
        <article class="card"><b>持续学习</b><p>保持好奇，从一个问题出发，慢慢积累新的知识。</p></article>
        <article class="card"><b>动手创造</b><p>把灵感变成小项目，在实践中发现更好的方法。</p></article>
        <article class="card"><b>记录分享</b><p>整理过程与收获，让每一步成长都能被看见。</p></article>
      </div>
    </section>
    <footer><span>我的个人主页 · 2026</span><span>由 HTML 与一点点好奇心构成</span></footer>
  </main>
</body>
</html>
